name: sandline CI

on:
  push:
    paths: ['sandline/**', '.github/workflows/sandline-ci.yml']
  pull_request:
    paths: ['sandline/**', '.github/workflows/sandline-ci.yml']

defaults:
  run:
    working-directory: sandline

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: sandline/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  # ADR-014: the transcendental-drift bug is invisible on a V8-to-V8 pairing.
  # Node and Chrome are both V8, so parity tests MUST also run on a non-V8
  # engine or nothing in this project can detect it.
  parity-non-v8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: sandline/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps firefox webkit
      - run: pnpm test:parity-browsers
