name: sandline Pages

on:
  push:
    branches: [claude/browser-conflict-desert-storm-8yq34l, main, master]
    paths: ['sandline/**', '.github/workflows/sandline-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sandline
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: sandline/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Vite must emit relative asset URLs: Pages serves from a subpath
      # (/<repo>/), so absolute /assets/... would 404.
      - run: pnpm --filter @sandline/client build -- --base=./
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sandline/packages/client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
