# XcodeGen spec.
#
# The repository already contains a generated XRControl.xcodeproj, so you can
# just open that. Regenerate it with `xcodegen generate` from this directory if
# you add files or want to change build settings.
name: XRControl
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  XRControl:
    type: application
    platform: iOS
    sources:
      - path: XRControl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.xrcontrol
        PRODUCT_NAME: XRControl
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: XRControl/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES

  XRControlTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: XRControlTests
    dependencies:
      - target: XRControl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.xrcontrol.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  XRControl:
    build:
      targets:
        XRControl: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - XRControlTests
