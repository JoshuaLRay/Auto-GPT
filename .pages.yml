# Pages CMS configuration (https://pagescms.org) - GENERATED.
# Lets Dustin edit + reorder page sections at app.pagescms.org via GitHub.
# All paths are relative to the repository root.

media:
  input: dustin-yelton-site/src/images/uploads
  output: /images/uploads
  extensions:
  - jpg
  - jpeg
  - png
  - webp
  - gif
  - svg
