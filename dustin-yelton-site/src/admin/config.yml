# Sveltia / Decap CMS configuration.
# Editors never see this file — they just see friendly forms at /admin/.
#
# AUTH: the github backend needs an OAuth handler. See ADMIN-SETUP.md for the
# one-time setup. Once a Sveltia auth worker is deployed, set its URL as
# `base_url` below (uncomment it).

backend:
  name: github
  repo: JoshuaLRay/Auto-GPT
  branch: claude/squarespace-dustin-yelton-poc-doh4b6
  # base_url: https://YOUR-SVELTIA-AUTH-WORKER.workers.dev

# Where uploaded photos are stored (path is relative to the repo root) and the
# URL they are served from on the built site.
media_folder: "dustin-yelton-site/src/images/uploads"
public_folder: "/images/uploads"

# A friendlier label and the editor UI language.
site_url: "/"
locale: "en"

collections:
  - name: settings
    label: "Site-wide Settings"
    delete: false
    editor:
      preview: false
    files:
      - name: business
        label: "Business Info (name, phone, email, footer)"
        file: "dustin-yelton-site/src/_data/site.json"
        fields:
          - { name: businessName, label: "Business Name (top line)", widget: string }
          - { name: businessNameSub, label: "Subtitle (under name)", widget: string }
          - { name: businessNameFull, label: "Full Business Name (footer)", widget: string }
          - { name: tagline, label: "Tagline", widget: string }
          - { name: phoneDisplay, label: "Phone (as shown)", widget: string }
          - { name: phoneHref, label: "Phone (dial format, e.g. +18595551234)", widget: string }
          - { name: email, label: "Email", widget: string }
          - { name: hoursText, label: "Business Hours", widget: string }
          - { name: serviceAreaShort, label: "Service Area (footer line)", widget: string }
          - { name: footerBlurb, label: "Footer Description", widget: text }
          - { name: footerBadgeLine, label: "Footer Badge Line", widget: string }
          - { name: footerCreativeNote, label: "Footer Note (right)", widget: string }

      - name: home
        label: "Home Page"
        file: "dustin-yelton-site/src/_data/home.json"
        fields:
          - { name: seoTitle, label: "SEO Title", widget: string }
          - { name: seoDescription, label: "SEO Description", widget: text }
          - { name: heroEyebrow, label: "Hero — small label", widget: string }
          - { name: heroH1, label: "Hero — headline", widget: string }
          - { name: heroLead, label: "Hero — subtext", widget: text }
          - name: heroBadges
            label: "Hero Badges"
            widget: list
            fields:
              - { name: text, label: "Badge", widget: string }
          - { name: servicesEyebrow, label: "Services — small label", widget: string }
          - { name: servicesH2, label: "Services — heading", widget: string }
          - { name: servicesLead, label: "Services — subtext", widget: text }
          - name: services
            label: "Service Tiles"
            widget: list
            fields:
              - { name: icon, label: "Icon (emoji)", widget: string }
              - { name: title, label: "Title", widget: string }
              - { name: body, label: "Description", widget: text }
              - { name: linkText, label: "Link Text", widget: string }
              - { name: linkUrl, label: "Link URL", widget: string }
          - { name: workEyebrow, label: "Recent Work — small label", widget: string }
          - { name: workH2, label: "Recent Work — heading", widget: string }
          - name: projects
            label: "Recent Work Photos"
            widget: list
            fields:
              - { name: image, label: "Photo", widget: image, required: false }
              - { name: caption, label: "Caption (shown if no photo)", widget: string }
          - { name: testimonialEyebrow, label: "Testimonial — small label", widget: string }
          - { name: testimonialQuote, label: "Testimonial — quote", widget: text }
          - { name: testimonialAuthor, label: "Testimonial — author", widget: string }
          - { name: ctaHeading, label: "Bottom CTA heading", widget: string }

      - name: painting
        label: "Painting Page"
        file: "dustin-yelton-site/src/_data/painting.json"
        fields:
          - { name: seoTitle, label: "SEO Title", widget: string }
          - { name: seoDescription, label: "SEO Description", widget: text }
          - { name: eyebrow, label: "Small label", widget: string }
          - { name: h1, label: "Headline", widget: string }
          - { name: lead, label: "Intro paragraph", widget: text }
          - name: whatIPaint
            label: "What I Paint (checklist)"
            widget: list
            fields:
              - { name: strong, label: "Bold part", widget: string }
              - { name: rest, label: "Rest", widget: string }
          - name: howItGoes
            label: "How a Job Goes (checklist)"
            widget: list
            fields:
              - { name: strong, label: "Bold part", widget: string }
              - { name: rest, label: "Rest", widget: string }
          - name: beforeAfter
            label: "Before / After Photos"
            widget: list
            fields:
              - { name: image, label: "Photo", widget: image, required: false }
              - { name: tag, label: "Tag (Before / After)", widget: string }
          - { name: serviceAreaIntro, label: "Service-area intro", widget: text }
          - name: serviceAreas
            label: "Service Areas"
            widget: list
            fields:
              - { name: name, label: "Area", widget: string }
          - { name: calloutH3, label: "Licensing callout — title", widget: string }
          - { name: calloutBody, label: "Licensing callout — text", widget: text }
          - { name: ctaHeading, label: "Bottom CTA heading", widget: string }

      - name: cleaning
        label: "Cleaning Page"
        file: "dustin-yelton-site/src/_data/cleaning.json"
        fields:
          - { name: seoTitle, label: "SEO Title", widget: string }
          - { name: seoDescription, label: "SEO Description", widget: text }
          - { name: eyebrow, label: "Small label", widget: string }
          - { name: h1, label: "Headline", widget: string }
          - { name: lead, label: "Intro paragraph", widget: text }
          - name: residential
            label: "Residential Cleaning (list)"
            widget: list
            fields:
              - { name: text, label: "Item", widget: string }
          - name: frequency
            label: "Frequency Options"
            widget: list
            fields:
              - { name: strong, label: "Bold part", widget: string }
              - { name: rest, label: "Rest", widget: string }
          - { name: frequencyNote, label: "Frequency note", widget: text }
          - { name: commercialH2, label: "Commercial — heading", widget: string }
          - { name: commercialIntro, label: "Commercial — intro", widget: text }
          - name: commercial
            label: "Commercial (list)"
            widget: list
            fields:
              - { name: text, label: "Item", widget: string }
          - name: whyCards
            label: "Why Clients Stay (cards)"
            widget: list
            fields:
              - { name: title, label: "Title", widget: string }
              - { name: body, label: "Body", widget: text }
          - { name: ctaHeading, label: "Bottom CTA heading", widget: string }

      - name: about
        label: "About Page"
        file: "dustin-yelton-site/src/_data/about.json"
        fields:
          - { name: seoTitle, label: "SEO Title", widget: string }
          - { name: seoDescription, label: "SEO Description", widget: text }
          - { name: h1, label: "Headline", widget: string }
          - name: bio
            label: "Bio Paragraphs"
            widget: list
            fields:
              - { name: paragraph, label: "Paragraph", widget: text }
          - { name: portrait, label: "Portrait Photo", widget: image, required: false }
          - { name: creativeEyebrow, label: "Creative — small label", widget: string }
          - { name: creativeH2, label: "Creative — heading", widget: string }
          - { name: creativeBody1, label: "Creative — paragraph 1", widget: text }
          - { name: creativeBody2, label: "Creative — paragraph 2", widget: text }
          - { name: creativeCalloutTitle, label: "Creative callout — title", widget: string }
          - { name: creativeCalloutBody, label: "Creative callout — text", widget: text }
          - name: artThumbs
            label: "Art Thumbnails"
            widget: list
            fields:
              - { name: image, label: "Art image", widget: image, required: false }
              - { name: label, label: "Label (shown if no image)", widget: string }
          - { name: valuesEyebrow, label: "Values — small label", widget: string }
          - { name: valuesH2, label: "Values — heading", widget: string }
          - name: valueCards
            label: "Value Cards"
            widget: list
            fields:
              - { name: title, label: "Title", widget: string }
              - { name: body, label: "Body", widget: text }
          - { name: ctaHeading, label: "Bottom CTA heading", widget: string }

      - name: contact
        label: "Contact Page"
        file: "dustin-yelton-site/src/_data/contact.json"
        fields:
          - { name: seoTitle, label: "SEO Title", widget: string }
          - { name: seoDescription, label: "SEO Description", widget: text }
          - { name: eyebrow, label: "Small label", widget: string }
          - { name: h1, label: "Headline", widget: string }
          - { name: lead, label: "Intro paragraph", widget: text }
          - name: serviceOptions
            label: "Form — Service Options"
            widget: list
            fields:
              - { name: label, label: "Option", widget: string }
          - { name: infoH2, label: "Contact info — heading", widget: string }
          - { name: ctaHeading, label: "Bottom CTA heading", widget: string }
