<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3a5e"/>
      <stop offset="1" stop-color="#1f2a44"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4623c"/>
      <stop offset="1" stop-color="#a44e2d"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- Abstract "freshly painted wall + roller" motif -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>
  <g opacity="0.18" fill="#ffffff">
    <rect x="120" y="120" width="520" height="660" rx="8"/>
    <rect x="700" y="220" width="380" height="560" rx="8"/>
    <rect x="1140" y="160" width="340" height="620" rx="8"/>
  </g>
  <g opacity="0.9">
    <rect x="980" y="300" width="300" height="190" rx="14" fill="url(#wall)" opacity="0.85"/>
  </g>
  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="2">
    <line x1="0" y1="225" x2="1600" y2="225"/>
    <line x1="0" y1="450" x2="1600" y2="450"/>
    <line x1="0" y1="675" x2="1600" y2="675"/>
  </g>
</svg>
